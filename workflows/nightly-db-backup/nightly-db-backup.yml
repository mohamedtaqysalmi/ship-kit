name: Nightly database backup

on:
  schedule:
    # 03:17 UTC — odd minute to avoid the top-of-hour stampede on shared runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-db-backup-${{ github.repository }}
  cancel-in-progress: false

env:
  # Objects under the prefix with a timestamp older than this many days are deleted, but only
  # after the restore test has passed.
  RETENTION_DAYS: "14"
  BACKUP_PREFIX: db-backups
  # Local Postgres used only for the restore test on the runner.
  RESTORE_HOST: 127.0.0.1
  RESTORE_PORT: "5432"
  RESTORE_USER: restore
  RESTORE_PASSWORD: restore
  RESTORE_DB: restore_check
  # The restore test fails if fewer non-system tables than this are loaded.
  MIN_TABLES: "1"

jobs:
  backup:
    name: Dump, upload, retain, restore-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Optional: Settings → Environments → backups for isolated secrets.
    environment: backups
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      PGPASSWORD: ${{ secrets.DB_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require backup secrets
        run: |
          missing=0
          for name in DB_HOST DB_PORT DB_USER DB_NAME DB_PASSWORD S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_REGION S3_ENDPOINT S3_BUCKET; do
            case "$name" in
              DB_HOST) val="$DB_HOST" ;;
              DB_PORT) val="$DB_PORT" ;;
              DB_USER) val="$DB_USER" ;;
              DB_NAME) val="$DB_NAME" ;;
              DB_PASSWORD) val="$PGPASSWORD" ;;
              S3_ACCESS_KEY_ID) val="$AWS_ACCESS_KEY_ID" ;;
              S3_SECRET_ACCESS_KEY) val="$AWS_SECRET_ACCESS_KEY" ;;
              S3_REGION) val="$AWS_DEFAULT_REGION" ;;
              S3_ENDPOINT) val="$AWS_ENDPOINT_URL" ;;
              S3_BUCKET) val="$S3_BUCKET" ;;
            esac
            if [ -z "$val" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          # AWS CLI v2 is preinstalled on ubuntu-24.04 GitHub-hosted runners.

      - name: Dump database
        id: dump
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          FILE="backup-${STAMP}.sql.gz"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          pg_dump \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --username="$DB_USER" \
            --dbname="$DB_NAME" \
            --no-owner \
            --no-acl \
            --format=plain \
            | gzip -9 > "$FILE"
          ls -lh "$FILE"

      - name: Upload to S3-compatible storage
        env:
          FILE: ${{ steps.dump.outputs.file }}
        run: |
          set -euo pipefail
          KEY="${BACKUP_PREFIX}/${FILE}"
          aws s3 cp "$FILE" "s3://${S3_BUCKET}/${KEY}"
          echo "Uploaded s3://${S3_BUCKET}/${KEY}"

      - name: Restore test into a fresh database
        env:
          FILE: ${{ steps.dump.outputs.file }}
          PGPASSWORD: ${{ env.RESTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Restore against the job's service Postgres only — never against the source DB.
          psql -h "$RESTORE_HOST" -p "$RESTORE_PORT" -U "$RESTORE_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS ${RESTORE_DB};" \
            -c "CREATE DATABASE ${RESTORE_DB};"
          gunzip -c "$FILE" | psql -h "$RESTORE_HOST" -p "$RESTORE_PORT" -U "$RESTORE_USER" -d "$RESTORE_DB" -v ON_ERROR_STOP=1
          tables="$(psql -h "$RESTORE_HOST" -p "$RESTORE_PORT" -U "$RESTORE_USER" -d "$RESTORE_DB" -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog', 'information_schema');")"
          echo "Restore test loaded ${tables} non-system table(s)."
          # A restore that loads fewer tables than MIN_TABLES is a failure. Raise the number or
          # add row-count checks for your own schema.
          test "$tables" -ge "$MIN_TABLES"

      - name: Apply retention
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "${RETENTION_DAYS} days ago" +%Y%m%dT%H%M%SZ)"
          echo "Deleting backups with stamp older than ${cutoff} under s3://${S3_BUCKET}/${BACKUP_PREFIX}/"
          aws s3api list-objects-v2 \
            --bucket "$S3_BUCKET" \
            --prefix "${BACKUP_PREFIX}/" \
            --query "Contents[].Key" \
            --output text \
          | tr '\t' '\n' \
          | while read -r key; do
              [ -z "$key" ] || [ "$key" = "None" ] && continue
              base="$(basename "$key")"
              # Expect backup-YYYYMMDDThhmmssZ.sql.gz
              stamp="$(printf '%s' "$base" | sed -n 's/^backup-\([0-9]\{8\}T[0-9]\{6\}Z\)\.sql\.gz$/\1/p')"
              if [ -z "$stamp" ]; then
                echo "Skipping unrecognized object: $key"
                continue
              fi
              if [[ "$stamp" < "$cutoff" ]]; then
                echo "Deleting $key"
                aws s3 rm "s3://${S3_BUCKET}/${key}"
              fi
            done
