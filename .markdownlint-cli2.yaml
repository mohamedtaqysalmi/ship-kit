config:
  default: true
  MD013: false # long lines are fine in prose
  MD033: false # allow inline HTML where GitHub renders it
  MD041: false # the PR template starts at level 2 on purpose
  MD024:
    siblings_only: true # Keep a Changelog repeats "Added" and "Fixed"
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
