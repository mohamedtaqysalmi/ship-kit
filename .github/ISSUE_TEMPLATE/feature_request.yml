name: Feature request
description: Suggest a change to an existing workflow or a new one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the current workflows do not cover?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Every workflow here needs real run evidence before it counts as tested.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
