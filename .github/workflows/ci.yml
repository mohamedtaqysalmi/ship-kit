name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums file.
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
      - name: Lint workflows
        run: |
          # This repo's own workflows plus every copy-paste workflow under workflows/.
          mapfile -t files < <(find .github/workflows workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          printf 'Linting %s file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # SC2016 fires on remote SSH snippets that must stay single-quoted so they
          # expand on the server (via env=...), not on the runner.
          ./actionlint -color -ignore 'SC2016:' "${files[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check "yamllint==1.38.0"
      - name: Run yamllint
        run: yamllint --strict -c .yamllint.yml .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.24.0

  site-sync:
    name: site matches workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Copy YAML into the site and check the catalog
        run: node scripts/sync-site.mjs
      - name: Snippets are byte-identical to workflows/
        run: |
          for f in site/snippets/*.yml; do
            id=$(basename "$f" .yml)
            cmp "$f" "workflows/$id/$id.yml"
          done
