name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "workflows/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh YAML snippets from workflows/
        run: |
          set -euo pipefail
          mkdir -p site/snippets
          cp workflows/pr-checks-python/pr-checks-python.yml site/snippets/
          cp workflows/pr-checks-node/pr-checks-node.yml site/snippets/
          cp workflows/docker-ghcr/docker-ghcr.yml site/snippets/
          cp workflows/release-from-tag/release-from-tag.yml site/snippets/
          cp workflows/ssh-deploy/ssh-deploy.yml site/snippets/
          cp workflows/nightly-db-backup/nightly-db-backup.yml site/snippets/
          ls -la site/snippets
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
